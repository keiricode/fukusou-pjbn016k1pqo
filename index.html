<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1726">
<title>今日の服装</title>
<style>
  :root {
    --ground: #0E1726;
    --chiiki: #BE185D;
    --saikou: #C2410C;
    --saitei: #1D4ED8;
    --nagasode: #0F766E;
    --ame: #0369A1;
    --line: rgba(255,255,255,0.35);
  }
  html, body { margin: 0; background: var(--ground); }
  body {
    max-width: 412px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; box-sizing: border-box;
    padding: 10px 16px 12px;
    font-family: "Yu Gothic UI", "Meiryo", sans-serif; color: #FFFFFF;
    display: flex; flex-direction: column; gap: 8px;
  }
  .head { display: flex; align-items: center; gap: 12px; }
  .burger { width: 46px; height: 46px; border: 0; border-radius: 12px; background: rgba(255,255,255,0.12);
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; padding: 0; cursor: pointer; }
  .burger span { display: block; width: 26px; height: 3px; background: #FFFFFF; border-radius: 2px; }
  .card { border-radius: 14px; padding: 8px 14px; text-align: center; }
  .head .card { flex: 1; padding: 6px 14px; }
  .row { display: flex; align-items: baseline; justify-content: center; gap: 14px; font-size: 20px; }
  .val { font-size: 28px; font-weight: 700; }
  .day { font-size: 20px; font-weight: 700; text-align: center; }
  .two { display: flex; gap: 8px; }
  .two .card { flex: 1; }
  .big { font-size: 42px; font-weight: 700; letter-spacing: 4px; line-height: 1.2; }
  .big.long { font-size: 36px; letter-spacing: 2px; }
  .credit { margin-top: auto; text-align: center; font-size: 16px; }
  .sepday { border-top: 4px solid #FFFFFF; border-radius: 2px; margin: 28px 0 20px; }
  .days { display: flex; flex-direction: column; gap: 8px; }
  #d1, #d1 * { color: #B8BEC8; }
  .error { font-size: 22px; line-height: 1.6; text-align: center; }

  .menu { position: fixed; inset: 0; background: var(--ground); z-index: 10; }
  .menu-in { max-width: 412px; margin: 0 auto; box-sizing: border-box; padding: 16px 20px 20px;
             display: flex; flex-direction: column; gap: 12px; }
  .close { width: 52px; height: 52px; border: 0; border-radius: 12px; background: rgba(255,255,255,0.12);
           color: #FFFFFF; font-size: 30px; line-height: 52px; text-align: center; padding: 0; cursor: pointer; font-family: inherit; }
  .title { font-size: 22px; font-weight: 700; }
  .rule { border-radius: 12px; padding: 22px 20px; display: flex; justify-content: space-between; align-items: center; }
  .rule .k { font-size: 18px; font-weight: 700; }
  .rule .v { font-size: 26px; font-weight: 700; }
  .han { background: #3C1111; border: 1px solid #6B1C1C; color: #F09595; }
  .naga { background: #10270F; border: 1px solid #1E4A1C; color: #4CAF50; }
  .cardi { background: #0B1F45; border: 1px solid #1E3A6E; color: #85B7EB; }
  /* 今日の段が余った高さを受け取って大きくなる（天気を取れないときは伸ばさない） */
  #d0:not(:empty) { flex: 1; }
  #d0 .two, #d0 > .card { flex: 1; }
  #d0 .card { display: flex; align-items: center; justify-content: center; }
  .credit { padding-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="head">
    <button class="burger" id="open" aria-label="メニュー"><span></span><span></span><span></span></button>
    <div class="card" style="background: var(--chiiki)">
      <div class="row"><span class="val">京都市北区</span></div>
    </div>
  </div>

  <div class="days" id="d0"></div>
  <div class="sepday"></div>
  <div class="days" id="d1"></div>

  <div class="error" id="error" hidden>天気を取れませんでした。<br>電波を確かめて、もう一度開いてください。</div>

  <div class="credit" id="credit">天気: Open-Meteo</div>

  <div class="menu" id="menu" hidden>
    <div class="menu-in">
      <div class="head">
        <button class="close" id="close" aria-label="閉じる">×</button>
        <div class="title">服装の基準</div>
      </div>
      <div class="rule han"><span class="k">最高気温 25℃以上</span><span class="v">半袖</span></div>
      <div class="rule naga"><span class="k">最高気温 20〜24℃</span><span class="v">長袖</span></div>
      <div class="rule cardi"><span class="k">最高気温 19℃以下</span><span class="v">カーディガン</span></div>
    </div>
  </div>

<script>
// 京都市北区（区役所あたり）の今日と明日の予報を Open-Meteo から取る
const URL_ = "https://api.open-meteo.com/v1/forecast?latitude=35.0444&longitude=135.7478"
  + "&daily=temperature_2m_max,temperature_2m_min"
  + "&hourly=precipitation_probability,weather_code"
  + "&timezone=Asia%2FTokyo&forecast_days=2";
// 予備: 気象庁の京都府の予報（鍵不要）
const JMA_URL = "https://www.jma.go.jp/bosai/forecast/data/forecast/260000.json";
// 予備の予備: 気象庁のアメダス（京都 61286）の今日ここまでの最高・最低（夕方17時の発表から今日の気温が予報から消えるため）
const AMEDAS = "https://www.jma.go.jp/bosai/amedas/data/";

// 夕方 = 16時〜19時。この間のどこかで降水確率50%以上なら「雨」
// Open-Meteo の1時間ごとの値は「その時刻までの1時間」なので、17・18・19時の値で16〜19時になる
const EVENING = [17, 18, 19];
// 明日の段は朝 = 8時〜10時（9・10時の値）
const MORNING = [9, 10];
const RAIN_LINE = 50;
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];

function fukuFor(maxC) {
  if (maxC >= 25) return "半袖";
  if (maxC >= 20) return "長袖";
  return "カーディガン";
}

function dayLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const w = WEEK[new Date(y, m - 1, d).getDay()];
  return m + "月" + d + "日（" + w + "）";
}

// Open-Meteo の予報から、1日分の中身（日付・最高・最低・天気・降水確率）を取り出す
function fromOpenMeteo(d, k, hoursUse) {
  const date = d.daily.time[k];
  const maxC = Math.round(d.daily.temperature_2m_max[k]);
  const minC = Math.round(d.daily.temperature_2m_min[k]);
  const idx = d.hourly.time
    .map((t, i) => (t.slice(0, 10) === date && hoursUse.includes(Number(t.slice(11, 13)))) ? i : -1)
    .filter(i => i >= 0);
  if (!idx.length || isNaN(maxC)) throw new Error("no data");
  const pop = Math.max(...idx.map(i => d.hourly.precipitation_probability[i] ?? 0));
  const codes = idx.map(i => d.hourly.weather_code[i] ?? 0);
  const rain = pop >= RAIN_LINE;
  const tenki = rain ? "雨" : (Math.max(...codes) >= 2 ? "くもり" : "晴れ");
  return { date, maxC, minC, tenki, pop, rain };
}

// 気象庁の予報（京都府南部・京都の気温）から、1日分の中身を取り出す（Open-Meteoが止まっているときの予備）
// 降水確率は6時間ごと（0・6・12・18時から）。blocks はその時間帯の始まりの時
function fromJma(j, date, blocks, obs) {
  const near = j[0].timeSeries, week = j[1] ? j[1].timeSeries : [];
  const at = (times, i) => times[i].slice(0, 10) === date ? Number(times[i].slice(11, 13)) : -1;

  // 気温: 京都（61286）。00時の欄が最低、09時の欄が最高。無ければ週間予報から
  let maxC = NaN, minC = NaN;
  const t2 = near[2], kyoto = t2.areas.find(a => a.area.code === "61286") || t2.areas[0];
  t2.timeDefines.forEach((t, i) => {
    const h = at(t2.timeDefines, i), v = kyoto.temps[i];
    if (v === "" || v == null) return;
    if (h === 9) maxC = Number(v);
    if (h === 0) minC = Number(v);
  });
  if (week[1]) {
    const wa = week[1].areas.find(a => a.area.code === "61286") || week[1].areas[0];
    week[1].timeDefines.forEach((t, i) => {
      if (t.slice(0, 10) !== date) return;
      if (isNaN(maxC) && wa.tempsMax[i] !== "") maxC = Number(wa.tempsMax[i]);
      if (isNaN(minC) && wa.tempsMin[i] !== "") minC = Number(wa.tempsMin[i]);
    });
  }
  // 朝5時の発表では、今日の最低の欄に最高と同じ数が入る（今日の最低は出ない）
  if (minC === maxC && date === near[2].timeDefines[0].slice(0, 10)) minC = NaN;
  // 予報に今日の気温が無い（夕方以降）ときは、アメダスの今日ここまでの最高・最低
  if (isNaN(maxC) && obs) { maxC = obs.max; minC = obs.min; }
  if (isNaN(maxC)) throw new Error("no temp");

  // 降水確率
  const p1 = near[1], pa = p1.areas.find(a => a.area.code === "260010") || p1.areas[0];
  const pops = [];
  p1.timeDefines.forEach((t, i) => {
    if (blocks.includes(at(p1.timeDefines, i)) && pa.pops[i] !== "") pops.push(Number(pa.pops[i]));
  });
  const pop = pops.length ? Math.max(...pops) : 0;

  // 天気コード（100番台=晴れ、200番台=くもり、300番台以上=雨や雪）
  const w0 = near[0], wa0 = w0.areas.find(a => a.area.code === "260010") || w0.areas[0];
  let code = "";
  w0.timeDefines.forEach((t, i) => { if (t.slice(0, 10) === date) code = wa0.weatherCodes[i]; });
  const rain = pop >= RAIN_LINE;
  const tenki = rain ? "雨" : (code.startsWith("1") ? "晴れ" : "くもり");
  return { date, maxC: Math.round(maxC), minC: isNaN(minC) ? NaN : Math.round(minC), tenki, pop, rain };
}

function dayHtml(name, s, when) {
  const { date, maxC, rain, pop, tenki } = s;
  const minC = isNaN(s.minC) ? "－" : s.minC + "℃";
  const fuku = fukuFor(maxC);
  const popHtml = rain ? '<span>降水確率</span><span class="val">' + pop + '%</span>' : "";

  return '<div class="day">' + name + '　' + dayLabel(date) + '</div>'
    + '<div class="two">'
    + '<div class="card" style="background: var(--saikou)"><div class="row"><span>最高</span><span class="val">' + maxC + '℃</span></div></div>'
    + '<div class="card" style="background: var(--saitei)"><div class="row"><span>最低</span><span class="val">' + minC + '</span></div></div>'
    + '</div>'
    + '<div class="card" style="background: var(--nagasode)">'
    + '<div class="row"><span class="big' + (fuku === "カーディガン" ? " long" : "") + '">' + fuku + '</span></div>'
    + '</div>'
    + '<div class="card" style="background: var(--ame)">'
    + '<div class="row"><span>' + when + '</span><span class="val">' + tenki + '</span>' + popHtml + '</div></div>';
}

// 待つのは10秒まで（返事が無いまま止まらないように）
async function getJson(url, ms = 10000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    const res = await fetch(url, { cache: "no-store", signal: ctl.signal });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

// 日本時間の今日と明日（YYYY-MM-DD）
function jstDates() {
  const f = n => new Date(Date.now() + 9 * 3600e3 + n * 86400e3).toISOString().slice(0, 10);
  return [f(0), f(1)];
}

// アメダス京都の今日ここまでの最高・最低（取れなければ null）
async function amedasToday() {
  try {
    const res = await fetch(AMEDAS + "latest_time.txt", { cache: "no-store" });
    const lt = (await res.text()).trim();              // 例 2026-11-14T20:10:00+09:00
    const ymd = lt.slice(0, 10).replace(/-/g, "");
    const h3 = String(Math.floor(Number(lt.slice(11, 13)) / 3) * 3).padStart(2, "0");
    const d = await getJson(AMEDAS + "point/61286/" + ymd + "_" + h3 + ".json");
    const keys = Object.keys(d).sort();
    for (let i = keys.length - 1; i >= 0; i--) {
      const r = d[keys[i]];
      if (r.maxTemp && r.maxTemp[0] != null && r.minTemp && r.minTemp[0] != null) {
        return { max: Number(r.maxTemp[0]), min: Number(r.minTemp[0]) };
      }
    }
  } catch (e) {}
  return null;
}

function show(today, tomorrow, source) {
  document.getElementById("d0").innerHTML = dayHtml("今日", today, "夕方の天気");
  document.getElementById("d1").innerHTML = dayHtml("明日", tomorrow, "朝の天気");
  document.getElementById("credit").textContent = "天気: " + source;
}

async function main() {
  // 開いたらすぐ、Open-Meteo・気象庁・アメダスへ同時に聞く（Open-Meteoが止まっていても待たされないように）
  const omP = getJson(URL_, 3000);          // Open-Meteoはふだん1秒かからないので、待つのは3秒まで
  const jmaP = getJson(JMA_URL);
  const obsP = amedasToday();
  omP.catch(() => {}); jmaP.catch(() => {});
  // ①ふだんは Open-Meteo
  try {
    const d = await omP;
    show(fromOpenMeteo(d, 0, EVENING), fromOpenMeteo(d, 1, MORNING), "Open-Meteo");
    return;
  } catch (e) {}
  // ②だめなら気象庁（夕方16〜19時 → 12時・18時からの枠、朝8〜10時 → 6時からの枠）
  try {
    const j = await jmaP;
    const [t0, t1] = jstDates();
    let today;
    try { today = fromJma(j, t0, [12, 18]); }
    catch (e) { today = fromJma(j, t0, [12, 18], await obsP); }
    show(today, fromJma(j, t1, [6]), "気象庁");
    return;
  } catch (e) {}
  document.getElementById("error").hidden = false;
}

document.getElementById("open").onclick = () => { document.getElementById("menu").hidden = false; };
document.getElementById("close").onclick = () => { document.getElementById("menu").hidden = true; };
main();
</script>
</body>
</html>
