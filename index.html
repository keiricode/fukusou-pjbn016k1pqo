<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1726">
<title>今日の服装</title>
<style>
  :root {
    --ground: #0E1726;
    --chiiki: #BE185D;
    --saikou: #C2410C;
    --saitei: #1D4ED8;
    --nagasode: #0F766E;
    --ame: #0369A1;
    --line: rgba(255,255,255,0.35);
  }
  html, body { margin: 0; background: var(--ground); }
  body {
    max-width: 412px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; box-sizing: border-box;
    padding: 10px 16px 12px;
    font-family: "Yu Gothic UI", "Meiryo", sans-serif; color: #FFFFFF;
    display: flex; flex-direction: column; gap: 8px;
  }
  .head { display: flex; align-items: center; gap: 12px; }
  .burger { width: 46px; height: 46px; border: 0; border-radius: 12px; background: rgba(255,255,255,0.12);
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; padding: 0; cursor: pointer; }
  .burger span { display: block; width: 26px; height: 3px; background: #FFFFFF; border-radius: 2px; }
  .card { border-radius: 14px; padding: 8px 14px; text-align: center; }
  .head .card { flex: 1; padding: 6px 14px; }
  .row { display: flex; align-items: baseline; justify-content: center; gap: 14px; font-size: 20px; }
  .val { font-size: 28px; font-weight: 700; }
  .day { font-size: 20px; font-weight: 700; text-align: center; }
  .two { display: flex; gap: 8px; }
  .two .card { flex: 1; }
  .big { font-size: 42px; font-weight: 700; letter-spacing: 4px; line-height: 1.2; }
  .big.long { font-size: 36px; letter-spacing: 2px; }
  .credit { margin-top: auto; text-align: center; font-size: 16px; }
  .sepday { border-top: 4px solid #FFFFFF; border-radius: 2px; margin: 12px 0 8px; }
  .days { display: flex; flex-direction: column; gap: 8px; }
  .error { font-size: 22px; line-height: 1.6; text-align: center; }

  .menu { position: fixed; inset: 0; background: var(--ground); z-index: 10; }
  .menu-in { max-width: 412px; margin: 0 auto; box-sizing: border-box; padding: 16px 20px 20px;
             display: flex; flex-direction: column; gap: 12px; }
  .close { width: 52px; height: 52px; border: 0; border-radius: 12px; background: rgba(255,255,255,0.12);
           color: #FFFFFF; font-size: 30px; line-height: 52px; text-align: center; padding: 0; cursor: pointer; font-family: inherit; }
  .title { font-size: 22px; font-weight: 700; }
  .rule { border-radius: 12px; padding: 22px 20px; display: flex; justify-content: space-between; align-items: center; }
  .rule .k { font-size: 18px; font-weight: 700; }
  .rule .v { font-size: 26px; font-weight: 700; }
  .han { background: #3C1111; border: 1px solid #6B1C1C; color: #F09595; }
  .naga { background: #10270F; border: 1px solid #1E4A1C; color: #4CAF50; }
  .cardi { background: #0B1F45; border: 1px solid #1E3A6E; color: #85B7EB; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="head">
    <button class="burger" id="open" aria-label="メニュー"><span></span><span></span><span></span></button>
    <div class="card" style="background: var(--chiiki)">
      <div class="row"><span class="val">京都市北区</span></div>
    </div>
  </div>

  <div class="days" id="d0"></div>
  <div class="sepday"></div>
  <div class="days" id="d1"></div>

  <div class="error" id="error" hidden>天気を取れませんでした。<br>電波を確かめて、もう一度開いてください。</div>

  <div class="credit">天気: Open-Meteo</div>

  <div class="menu" id="menu" hidden>
    <div class="menu-in">
      <div class="head">
        <button class="close" id="close" aria-label="閉じる">×</button>
        <div class="title">服装の基準</div>
      </div>
      <div class="rule han"><span class="k">最高気温 25℃以上</span><span class="v">半袖</span></div>
      <div class="rule naga"><span class="k">最高気温 20〜24℃</span><span class="v">長袖</span></div>
      <div class="rule cardi"><span class="k">最高気温 19℃以下</span><span class="v">カーディガン</span></div>
    </div>
  </div>

<script>
// 京都市北区（区役所あたり）の今日と明日の予報を Open-Meteo から取る
const URL_ = "https://api.open-meteo.com/v1/forecast?latitude=35.0444&longitude=135.7478"
  + "&daily=temperature_2m_max,temperature_2m_min"
  + "&hourly=precipitation_probability,weather_code"
  + "&timezone=Asia%2FTokyo&forecast_days=2";

// 夕方 = 16時〜19時。この間のどこかで降水確率50%以上なら「雨」
// Open-Meteo の1時間ごとの値は「その時刻までの1時間」なので、17・18・19時の値で16〜19時になる
const EVENING = [17, 18, 19];
// 明日の段は朝 = 8時〜10時（9・10時の値）
const MORNING = [9, 10];
const RAIN_LINE = 50;
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];

function fukuFor(maxC) {
  if (maxC >= 25) return "半袖";
  if (maxC >= 20) return "長袖";
  return "カーディガン";
}

function dayLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const w = WEEK[new Date(y, m - 1, d).getDay()];
  return m + "月" + d + "日（" + w + "）";
}

function dayHtml(name, d, k, hoursUse, when) {
  const date = d.daily.time[k];
  const maxC = Math.round(d.daily.temperature_2m_max[k]);
  const minC = Math.round(d.daily.temperature_2m_min[k]);

  const idx = d.hourly.time
    .map((t, i) => (t.slice(0, 10) === date && hoursUse.includes(Number(t.slice(11, 13)))) ? i : -1)
    .filter(i => i >= 0);
  const pop = Math.max(...idx.map(i => d.hourly.precipitation_probability[i] ?? 0));
  const codes = idx.map(i => d.hourly.weather_code[i] ?? 0);
  const rain = pop >= RAIN_LINE;
  const tenki = rain ? "雨" : (Math.max(...codes) >= 2 ? "くもり" : "晴れ");

  const fuku = fukuFor(maxC);
  const popHtml = rain ? '<span>降水確率</span><span class="val">' + pop + '%</span>' : "";

  return '<div class="day">' + name + '　' + dayLabel(date) + '</div>'
    + '<div class="two">'
    + '<div class="card" style="background: var(--saikou)"><div class="row"><span>最高</span><span class="val">' + maxC + '℃</span></div></div>'
    + '<div class="card" style="background: var(--saitei)"><div class="row"><span>最低</span><span class="val">' + minC + '℃</span></div></div>'
    + '</div>'
    + '<div class="card" style="background: var(--nagasode)">'
    + '<div class="row"><span class="big' + (fuku === "カーディガン" ? " long" : "") + '">' + fuku + '</span></div>'
    + '</div>'
    + '<div class="card" style="background: var(--ame)">'
    + '<div class="row"><span>' + when + '</span><span class="val">' + tenki + '</span>' + popHtml + '</div></div>';
}

async function main() {
  try {
    const res = await fetch(URL_, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    document.getElementById("d0").innerHTML = dayHtml("今日", d, 0, EVENING, "夕方の天気");
    document.getElementById("d1").innerHTML = dayHtml("明日", d, 1, MORNING, "朝の天気");
  } catch (e) {
    document.getElementById("error").hidden = false;
  }
}

document.getElementById("open").onclick = () => { document.getElementById("menu").hidden = false; };
document.getElementById("close").onclick = () => { document.getElementById("menu").hidden = true; };
main();
</script>
</body>
</html>
